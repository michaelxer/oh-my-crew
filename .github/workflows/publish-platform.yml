name: publish-platform
run-name: "platform packages ${{ inputs.version }}"

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      dist_tag:
        required: false
        type: string
        default: ""
    secrets:
      NPM_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 2.1.6)"
        required: true
        type: string
      dist_tag:
        description: "npm dist tag (e.g., beta, latest)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ${{ matrix.platform == 'windows-x64-baseline' && 'ubuntu-latest' || startsWith(matrix.platform, 'windows-') && 'windows-latest' || startsWith(matrix.platform, 'darwin-') && 'macos-latest' || 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 11
      matrix:
        platform: [darwin-arm64, darwin-x64, darwin-x64-baseline, linux-x64, linux-x64-baseline, linux-arm64, linux-x64-musl, linux-x64-musl-baseline, linux-arm64-musl, windows-x64, windows-x64-baseline]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        env:
          BUN_INSTALL_ALLOW_SCRIPTS: "@ast-grep/napi"

      - name: Validate release inputs
        id: validate
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          VERSION="$INPUT_VERSION"
          DIST_TAG="$INPUT_DIST_TAG"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Invalid version: $VERSION"
            exit 1
          fi

          if [ -n "$DIST_TAG" ] && ! [[ "$DIST_TAG" =~ ^[a-z][a-z0-9-]*$ ]]; then
            echo "::error::Invalid dist_tag: $DIST_TAG"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: Check if already published
        id: check
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/oh-my-crew-${{ matrix.platform }}/${VERSION}")
          echo "oh-my-crew-${{ matrix.platform }}@${VERSION}: ${STATUS}"

          if [ "$STATUS" = "200" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update package versions
        if: steps.check.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json
          jq --arg v "$VERSION" '.version = $v' "packages/${{ matrix.platform }}/package.json" > tmp.json && mv tmp.json "packages/${{ matrix.platform }}/package.json"

      - name: Build binary
        if: steps.check.outputs.skip != 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 10
          shell: bash
          command: |
            PLATFORM="${{ matrix.platform }}"
            case "$PLATFORM" in
              darwin-arm64) TARGET="bun-darwin-arm64" ;;
              darwin-x64) TARGET="bun-darwin-x64" ;;
              darwin-x64-baseline) TARGET="bun-darwin-x64-baseline" ;;
              linux-x64) TARGET="bun-linux-x64" ;;
              linux-x64-baseline) TARGET="bun-linux-x64-baseline" ;;
              linux-arm64) TARGET="bun-linux-arm64" ;;
              linux-x64-musl) TARGET="bun-linux-x64-musl" ;;
              linux-x64-musl-baseline) TARGET="bun-linux-x64-musl-baseline" ;;
              linux-arm64-musl) TARGET="bun-linux-arm64-musl" ;;
              windows-x64) TARGET="bun-windows-x64" ;;
              windows-x64-baseline) TARGET="bun-windows-x64-baseline" ;;
            esac

            if [[ "$PLATFORM" == windows-* ]]; then
              OUTPUT="packages/${PLATFORM}/bin/oh-my-opencode.exe"
            else
              OUTPUT="packages/${PLATFORM}/bin/oh-my-opencode"
            fi

            bun build src/cli/index.ts --compile --minify --target="$TARGET" --outfile="$OUTPUT"
            ls -lh "$OUTPUT"

      - name: Ad-hoc sign darwin binary
        if: steps.check.outputs.skip != 'true' && startsWith(matrix.platform, 'darwin-')
        run: |
          BINARY="packages/${{ matrix.platform }}/bin/oh-my-opencode"
          codesign --remove-signature "$BINARY" 2>/dev/null || true
          codesign --sign - --force --timestamp=none "$BINARY"
          codesign --verify --verbose "$BINARY"

      - name: Compress binary
        if: steps.check.outputs.skip != 'true'
        run: |
          PLATFORM="${{ matrix.platform }}"
          cd "packages/${PLATFORM}"

          if [[ "$PLATFORM" == windows-* ]]; then
            if command -v zip >/dev/null 2>&1; then
              zip -r "../../binary-${PLATFORM}.zip" bin/ package.json
            else
              7z a -tzip "../../binary-${PLATFORM}.zip" bin/ package.json
            fi
          else
            tar -czvf "../../binary-${PLATFORM}.tar.gz" bin/ package.json
          fi

      - name: Upload artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: |
            binary-${{ matrix.platform }}.tar.gz
            binary-${{ matrix.platform }}.zip
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        platform: [darwin-arm64, darwin-x64, darwin-x64-baseline, linux-x64, linux-x64-baseline, linux-arm64, linux-x64-musl, linux-x64-musl-baseline, linux-arm64-musl, windows-x64, windows-x64-baseline]
    steps:
      - name: Validate release inputs
        id: validate
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          VERSION="$INPUT_VERSION"
          DIST_TAG="$INPUT_DIST_TAG"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Invalid version: $VERSION"
            exit 1
          fi

          if [ -n "$DIST_TAG" ] && ! [[ "$DIST_TAG" =~ ^[a-z][a-z0-9-]*$ ]]; then
            echo "::error::Invalid dist_tag: $DIST_TAG"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: Check if already published
        id: check
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/oh-my-crew-${{ matrix.platform }}/${VERSION}")
          if [ "$STATUS" = "200" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifact
        id: download
        if: steps.check.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: .

      - name: Extract artifact
        if: steps.check.outputs.skip != 'true'
        run: |
          PLATFORM="${{ matrix.platform }}"
          mkdir -p "packages/${PLATFORM}"

          if [[ "$PLATFORM" == windows-* ]]; then
            unzip "binary-${PLATFORM}.zip" -d "packages/${PLATFORM}/"
          else
            tar -xzvf "binary-${PLATFORM}.tar.gz" -C "packages/${PLATFORM}/"
          fi

      - uses: actions/setup-node@v6
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for trusted publishing
        if: steps.check.outputs.skip != 'true'
        run: npm install -g npm@latest

      - name: Configure npm authentication
        if: steps.check.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "Using NPM_TOKEN for npm publish."
            npm whoami >/dev/null
            exit 0
          fi

          echo "No NPM_TOKEN configured; using npm trusted publishing via OIDC."
          for f in .npmrc "$HOME/.npmrc"; do
            if [ -f "$f" ]; then
              sed -i.bak '/_authToken/d' "$f"
              rm -f "$f.bak"
            fi
          done

      - name: Publish oh-my-crew-${{ matrix.platform }}
        if: steps.check.outputs.skip != 'true'
        env:
          DIST_TAG: ${{ steps.validate.outputs.dist_tag }}
          NPM_CONFIG_PROVENANCE: true
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -o pipefail
          cd "packages/${{ matrix.platform }}"

          publish_package() {
            if [ -n "$DIST_TAG" ]; then
              npm publish --access public --provenance --tag "$DIST_TAG" --loglevel verbose
            else
              npm publish --access public --provenance --loglevel verbose
            fi
          }

          for attempt in 1 2 3; do
            if publish_package 2>&1 | tee npm-publish.log; then
              exit 0
            fi

            if ! grep -Eq "E429|Too Many Requests|rate limited" npm-publish.log || [ "$attempt" = "3" ]; then
              exit 1
            fi

            sleep_seconds=$((attempt * 300))
            echo "npm publish was rate-limited; retrying in ${sleep_seconds}s (attempt ${attempt}/3)."
            sleep "$sleep_seconds"
          done
        timeout-minutes: 30
